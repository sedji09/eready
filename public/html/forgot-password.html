<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - E-READY</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="left-section">
      <div class="logo-container">
        <h1 class="logo-text">EREADY</h1>
        <img src="/images/emergency-kit.png" alt="Emergency Kit" class="kit-image" onerror="this.style.display='none'">
        <p class="tagline">
          DISASTER <span>TODAY?</span> KAYA 'TO, <span>SLAY!</span>
        </p>
      </div>
    </div>

    <div class="right-section">
      <div id="alert-container" style="margin: 15px 0;"></div>

      <form id="forgotPasswordForm">
        <h2 class="form-title" style="color: white; margin-bottom: 10px;">Forgot Password</h2>
        <p style="color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 30px;">Enter your email address and we'll send you a link to reset your password.</p>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="btn-login">SEND RESET LINK</button>

        <div class="login-link" style="margin-top: 30px;">
          <a href="/login">Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/forgot-password.js"></script>
</body>
</html>
